<!DOCTYPE html>
<html>
<head>
  <meta charset="big5">
  <link rel="stylesheet" href="/style.css">
  <title>檔案管理系統</title>
</head>
<body>
  <div class="container">
      <h1>檔案管理系統</h1>
      <h3>您已成功登入系統</h3>
      
      <!-- 訊息顯示區域 -->
      <div id="message" class="message" style="display:none;"></div>
      
      <!-- 上傳檔案區域 -->
      <div class="section">
          <h2>上傳檔案</h2>
          <form id="uploadForm" enctype="multipart/form-data" class="upload-form">
              <input type="file" name="file" id="fileInput" required>
              <button type="submit" class="btn-primary">上傳</button>
          </form>
      </div>

      <!-- 檔案列表區域 -->
      <div class="section">
          <h2>檔案列表</h2>
          <button onclick="location.reload()" class="btn-secondary">重新整理</button>
          <div id="fileList" class="file-list">
              <p style="text-align: center; color: #666;">載入中...</p>
          </div>
      </div>

      <!-- 登出按鈕 -->
      <form action="" method="post" class="logout-form">
          <input type="hidden" name="logout" value="1">
          <button type="submit" class="btn-secondary">登出</button>
      </form>
  </div>

  <script>
      // 簡單顯示訊息
      function showMessage(msg, type) {
          var messageDiv = document.getElementById('message');
          messageDiv.textContent = msg;
          messageDiv.className = 'message ' + (type || 'success');
          messageDiv.style.display = 'block';
      }

      // 格式化檔案大小
      function formatSize(bytes) {
          if (bytes < 1024) return bytes + ' B';
          if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
          return (bytes/1048576).toFixed(1) + ' MB';
      }

      // 載入檔案列表
      function loadFiles() {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', '/upload/');
          xhr.onload = function() {
              var fileListDiv = document.getElementById('fileList');
              if (xhr.status === 200) {
                  try {
                      var files = JSON.parse(xhr.responseText);
                      if (files.length === 0) {
                          fileListDiv.innerHTML = '<p style="text-align: center; color: #666;">目前沒有檔案</p>';
                      } else {
                          var html = '';
                          for (var i = 0; i < files.length; i++) {
                              html += '<div class="file-item">' +
                                     '<div class="file-info">' +
                                     '<span class="file-name">' + files[i].name + '</span>' +
                                     '<span class="file-size">' + formatSize(files[i].size) + '</span>' +
                                     '</div>' +
                                     '<div class="file-actions">' +
                                     '<button onclick="checkFileHeader(\'' + files[i].name + '\')" class="btn-info">檢查</button>' +
                                     '<button onclick="downloadFile(\'' + files[i].name + '\')" class="btn-success">下載</button>' +
                                     '<button onclick="deleteFile(\'' + files[i].name + '\')" class="btn-danger">刪除</button>' +
                                     '</div></div>';
                          }
                          fileListDiv.innerHTML = html;
                      }
                  } catch (e) {
                      fileListDiv.innerHTML = '<p style="color: red;">載入檔案列表失敗</p>';
                  }
              } else {
                  fileListDiv.innerHTML = '<p style="color: red;">無法載入檔案列表</p>';
              }
          };
          xhr.send();
      }

      // 使用HEAD請求檢查檔案
      function checkFileHeader(filename) {
          var xhr = new XMLHttpRequest();
          xhr.open('HEAD', '/upload/' + encodeURIComponent(filename));
          xhr.onload = function() {
              if (xhr.status === 200) {
                  // 取得檔案的Content-Type和Content-Length
                  var contentType = xhr.getResponseHeader('Content-Type') || '未知';
                  var contentLength = xhr.getResponseHeader('Content-Length') || '未知';
                  showMessage('檔案信息: ' + filename + '\n類型: ' + contentType + '\n大小: ' + formatSize(contentLength));
              } else {
                  showMessage('無法獲取檔案信息', 'error');
              }
          };
          xhr.send();
      }

      // 下載檔案
      function downloadFile(filename) {
          window.open('/upload/' + encodeURIComponent(filename));
          showMessage('開始下載: ' + filename);
      }

      // 刪除檔案
      function deleteFile(filename) {
          if (!confirm('確定要刪除 "' + filename + '" 嗎？')) return;
          var xhr = new XMLHttpRequest();
          xhr.open('DELETE', '/upload/' + encodeURIComponent(filename));
          xhr.onload = function() {
              if (xhr.status === 200) {
                  showMessage('檔案已刪除: ' + filename);
                  loadFiles();
              } else {
                  showMessage('刪除失敗', 'error');
              }
          };
          xhr.send();
      }

      // 上傳檔案
      document.getElementById('uploadForm').onsubmit = function(e) {
          e.preventDefault();
          
          var fileInput = document.getElementById('fileInput');
          if (!fileInput.files[0]) {
              showMessage('請選擇檔案', 'error');
              return;
          }
          
          var formData = new FormData();
          formData.append('file', fileInput.files[0]);
          
          var xhr = new XMLHttpRequest();
          xhr.open('PUT', '/upload/');
          xhr.onload = function() {
              if (xhr.status === 200) {
                  showMessage('上傳成功');
                  fileInput.value = '';
                  loadFiles();
              } else {
                  showMessage('上傳失敗', 'error');
              }
          };
          xhr.send(formData);
      };

      // 頁面載入時載入檔案列表
      window.onload = function() {
          loadFiles();
      };
  </script>
</body>
</html>
